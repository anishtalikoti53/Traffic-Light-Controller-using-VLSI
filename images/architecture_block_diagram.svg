<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="white"/>
<text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">Traffic Light Controller — RTL Architecture</text>
<g font-family="Arial" font-size="18" text-anchor="middle">
<rect x="70" y="105" width="180" height="70" rx="10" fill="#e8f0fe" stroke="#333" stroke-width="2"/><text x="160" y="147">Clock</text>
<rect x="70" y="270" width="180" height="70" rx="10" fill="#fff3cd" stroke="#333" stroke-width="2"/><text x="160" y="312">clear</text>
<rect x="360" y="115" width="250" height="170" rx="12" fill="#f3e8ff" stroke="#333" stroke-width="2"/><text x="485" y="155" font-weight="bold">State Register</text><text x="485" y="190">3-bit state</text><text x="485" y="225">S0–S4</text><text x="485" y="260">posedge clock</text>
<rect x="360" y="350" width="250" height="90" rx="12" fill="#e8f5e9" stroke="#333" stroke-width="2"/><text x="485" y="385" font-weight="bold">Next-State Logic</text><text x="485" y="415">state + X</text>
<rect x="730" y="115" width="200" height="170" rx="12" fill="#ffe8e8" stroke="#333" stroke-width="2"/><text x="830" y="155" font-weight="bold">Output Logic</text><text x="830" y="195">Moore-style decode</text><text x="830" y="230">hwy[1:0]</text><text x="830" y="260">entry[1:0]</text>
<text x="160" y="245">vehicle input</text><text x="160" y="390">reset to S0</text>
</g>
<g stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M250 140 H360"/><path d="M250 305 H320 V190 H360"/><path d="M485 285 V350"/><path d="M610 395 H680 V200 H730"/><path d="M610 200 H730"/>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs>
<text x="500" y="490" text-anchor="middle" font-family="Arial" font-size="16">Inputs: clock, clear, X  |  Outputs: highway and entry 2-bit light encodings</text>
</svg>
